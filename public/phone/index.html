<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FLIX-UG Phone Download</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; max-width: 480px; }
    h1 { font-size: 22px; }
    input, button { font-size: 16px; padding: 10px; width: 100%; box-sizing: border-box; margin: 6px 0; }
    #status { margin-top: 12px; white-space: pre-wrap; }
    #save { display: inline-block; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>FLIX-UG</h1>
  <form id="form">
    <input id="token" placeholder="Token number" autocomplete="off" required>
    <input id="pin" placeholder="PIN" inputmode="numeric" autocomplete="off" required>
    <input id="title" placeholder="Title ID" autocomplete="off" required>
    <button type="submit">Download</button>
  </form>
  <div id="status" role="status"></div>
  <a id="save" hidden>Save</a>
  <button id="finish" hidden>Saved</button>

  <script type="module">
    import {
      clearPart, downloadNextChunk, finalChecksumMatches, indexedDbStore, partBlob, partCount,
    } from './assemble.js';

    // Must match the server's chunk size (4 MiB).
    const CHUNK_SIZE = 4 * 1024 * 1024;
    const SESSION_KEY = 'flix-phone-session';
    const store = indexedDbStore();
    const $ = (id) => document.getElementById(id);
    const say = (text) => { $('status').textContent = text; };

    const messages = {
      bad_pin: 'The PIN is wrong.',
      unknown_token: 'That token number is not recognised.',
      unknown_title: 'That title is not available.',
      locked: 'Too many wrong PINs. Try again in 15 minutes.',
      insufficient_balance: 'Not enough balance on this token. Please see the attendant to top up.',
      active_session_exists: 'This token is already downloading somewhere else.',
    };

    // The step the page is waiting on: a finished part (save it, then continue) or the finish.
    let pending = null;

    function rememberSession(id) { try { localStorage.setItem(SESSION_KEY, id); } catch {} }
    function recalledSession() { try { return localStorage.getItem(SESSION_KEY); } catch { return null; } }
    function forgetSession() { try { localStorage.removeItem(SESSION_KEY); } catch {} }

    async function readJson(res) { return res.json().catch(() => ({})); }

    async function fetchChunk(sessionId, index, link) {
      const res = await fetch(`/sessions/${sessionId}/chunks/${index}?exp=${link.exp}&sig=${link.sig}`);
      if (!res.ok) throw new Error(`chunk ${index} returned ${res.status}`);
      return res.arrayBuffer();
    }

    async function confirm(sessionId, offset) {
      await fetch(`/sessions/${sessionId}/confirm`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ offset }),
      });
    }

    function stepsFor(ctx) {
      return {
        sessionId: ctx.sessionId, chunkCount: ctx.chunkCount, fileSize: ctx.fileSize, chunkSize: CHUNK_SIZE,
        chunkHashes: ctx.chunkHashes, links: ctx.links,
        fetchChunk: (index, link) => fetchChunk(ctx.sessionId, index, link),
        confirm: (offset) => confirm(ctx.sessionId, offset),
      };
    }

    // Downloads until a part is finished (offered for saving), or until the whole movie is ready to finish.
    async function nextStep(ctx) {
      const total = partCount(ctx.chunkCount);
      for (;;) {
        const r = await downloadNextChunk(store, stepsFor(ctx));
        if (!r.ok) {
          say(`Paused (${r.reason}). Nothing more has been charged. Reopen this page to continue.`);
          return;
        }
        if (r.done) return offerPart(ctx, total - 1, true);
        if (r.partComplete) return offerPart(ctx, r.part, r.part === total - 1);
      }
    }

    async function offerPart(ctx, part, last) {
      const total = partCount(ctx.chunkCount);
      const blob = await partBlob(store, ctx.sessionId, part, ctx.chunkCount);
      const link = $('save');
      if (link.href.startsWith('blob:')) URL.revokeObjectURL(link.href);
      link.href = URL.createObjectURL(blob);
      link.download = total > 1 ? `${ctx.titleId}.part${part + 1}of${total}.mp4` : `${ctx.titleId}.mp4`;
      link.textContent = total > 1 ? `Save part ${part + 1} of ${total}` : 'Save file';
      link.hidden = false;
      $('finish').textContent = last ? 'Saved, finish' : `Saved part ${part + 1}, get the next part`;
      $('finish').hidden = false;
      pending = { ...ctx, part, last };
      say(last
        ? 'Ready. Save the file, then tap "Saved, finish" once it is on your phone.'
        : `Part ${part + 1} of ${total} is ready. Save it, then tap "Saved part ${part + 1}" to get the next part.`);
    }

    async function completeMovie(ctx) {
      const matches = await finalChecksumMatches(store, ctx.sessionId, ctx.fileChecksum, ctx.chunkCount);
      if (!matches) {
        say('The movie did not pass its final check. Please see the attendant.');
        return false;
      }
      const done = await fetch(`/sessions/${ctx.sessionId}/complete`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ checksum: ctx.fileChecksum }),
      });
      const data = await readJson(done);
      if (!done.ok && data.reason !== 'not_active') {
        say(`Could not finish (${data.reason}). Your file is still here; try again.`);
        return false;
      }
      return true;
    }

    async function run(info, titleId) {
      const ctx = {
        sessionId: info.sessionId,
        chunkCount: info.chunkHashes.length,
        fileSize: info.fileSize,
        chunkHashes: info.chunkHashes,
        fileChecksum: info.fileChecksum,
        links: info.links,
        titleId,
      };
      rememberSession(ctx.sessionId);
      say('Downloading… keep this page open. Progress is saved, so you can come back later.');
      await nextStep(ctx);
    }

    $('finish').addEventListener('click', async () => {
      if (!pending) return;
      const ctx = pending;
      if (ctx.last) {
        // Complete first: the last part's chunks stay until the server has accepted the completion.
        if (!(await completeMovie(ctx))) return;
        await store.clear(`${ctx.sessionId}:`);
        forgetSession();
        pending = null;
        $('save').hidden = true;
        $('finish').hidden = true;
        say('Finished.');
        return;
      }
      await clearPart(store, ctx.sessionId, ctx.part, ctx.chunkCount);
      pending = null;
      $('save').hidden = true;
      $('finish').hidden = true;
      await nextStep(ctx);
    });

    $('form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const titleId = $('title').value.trim();
      const res = await fetch('/sessions', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          tokenNumber: $('token').value.trim(),
          pin: $('pin').value.trim(),
          titleId,
          destination: 'phone',
        }),
      });
      const data = await readJson(res);
      // A paused download on this device is still open on the server: resume it instead of refusing.
      if (!res.ok && data.reason === 'active_session_exists' && recalledSession()) {
        const open = await readJson(await fetch(`/sessions/${recalledSession()}`));
        if (open.status === 'active') {
          await run(open, titleId);
          return;
        }
      }
      if (!res.ok) {
        say(messages[data.reason] ?? `Could not start the download (${data.reason ?? res.status}).`);
        return;
      }
      await run(data, titleId);
    });

    // Reopening the page resumes an unfinished download.
    const unfinished = recalledSession();
    if (unfinished) {
      fetch(`/sessions/${unfinished}`).then(readJson).then((data) => {
        if (data.status === 'active') run(data, data.titleId ?? 'movie');
        else forgetSession();
      });
    }
  </script>
</body>
</html>
